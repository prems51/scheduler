name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run dist -- --publish never

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match 'Setup.*\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName)
          if (-not ($assets | Where-Object { $_ -match 'Setup.*\.exe$' })) { throw 'NSIS installer was not found in dist.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
